apiVersion: kavrynt.io/v1alpha1
kind: MCPServer
metadata:
  name: search
  annotations:
    kavrynt.io/description: HTTP MCP server that needs its own bearer token, sent by the Gateway from the upstream credentials Secret
spec:
  version: 1.0.0
  transport: http
  endpoint: http://search.team-a.svc.cluster.local:8080/mcp
  # The token is stored by the platform team in the Secret named by the chart
  # value global.upstreamCredentials.secretName, under the keys
  # <namespace>.search and <namespace>.search.origin
  # (http://search.team-a.svc.cluster.local:8080). It is never part of this
  # manifest.
  credential:
    scheme: Bearer
