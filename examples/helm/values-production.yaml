# Production profile for the Kavrynt chart (SPEC-0008): Gateway replicas that
# survive node drains, upgrades, and pod loss without failing MCP calls, and a
# standby Operator that takes over through leader election. make e2e-kind
# installs with this file.
#
#   helm upgrade --install kavrynt oci://ghcr.io/kavrynt/charts/kavrynt \
#     --version <version> --namespace kavrynt-system --create-namespace \
#     --values values-production.yaml
#
# Size resources for your traffic; these are starting points.

gateway:
  replicaCount: 3
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  config:
    shutdownDelay: 5s
    shutdownTimeout: 30s
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Or let an autoscaler own the replica count (needs metrics-server):
  # autoscaling:
  #   enabled: true
  #   minReplicas: 3
  #   maxReplicas: 10

operator:
  replicaCount: 2
  config:
    leaderElect: true
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
