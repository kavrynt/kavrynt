# A small MCP server for trying Kavrynt on any Kubernetes cluster. It speaks
# MCP Streamable HTTP (JSON answers) with two tools, echo and admin_reset (a
# harmless stand-in for a sensitive tool), and needs no image build: the
# server is Python standard library code in a ConfigMap, run on the public
# python image. For testing only.
#
#   kubectl apply -f sample-mcp-server.yaml
#
# Used by docs/TESTING.md.
apiVersion: v1
kind: Namespace
metadata:
  name: kavrynt-try
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-mcp-server
  namespace: kavrynt-try
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    TOOLS = [
        {"name": "echo", "description": "Return the message you send.",
         "inputSchema": {"type": "object", "required": ["message"],
                         "properties": {"message": {"type": "string"}}}},
        {"name": "admin_reset", "description": "Pretend to reset everything (does nothing).",
         "inputSchema": {"type": "object", "properties": {}}},
    ]

    def answer(message):
        method, params = message.get("method"), message.get("params") or {}
        if method == "initialize":
            return {"protocolVersion": params.get("protocolVersion", "2025-06-18"),
                    "capabilities": {"tools": {}},
                    "serverInfo": {"name": "kavrynt-sample", "version": "1.0.0"}}
        if method == "tools/list":
            return {"tools": TOOLS}
        if method == "tools/call":
            name, args = params.get("name"), params.get("arguments") or {}
            if name == "echo":
                return {"content": [{"type": "text", "text": str(args.get("message", ""))}]}
            if name == "admin_reset":
                return {"content": [{"type": "text", "text": "reset done (sample: nothing changed)"}]}
            return {"isError": True, "content": [{"type": "text", "text": "unknown tool"}]}
        if method == "ping":
            return {}
        return None

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200 if self.path == "/healthz" else 405)
            self.end_headers()

        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("Content-Length") or 0))
            try:
                message = json.loads(body)
            except ValueError:
                return self.reply(400, {"jsonrpc": "2.0", "id": None,
                                        "error": {"code": -32700, "message": "parse error"}})
            if "id" not in message:  # a notification
                self.send_response(202)
                self.end_headers()
                return
            result = answer(message)
            if result is None:
                return self.reply(200, {"jsonrpc": "2.0", "id": message["id"],
                                        "error": {"code": -32601, "message": "method not found"}})
            self.reply(200, {"jsonrpc": "2.0", "id": message["id"], "result": result})

        def reply(self, status, value):
            data = json.dumps(value).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-mcp-server
  namespace: kavrynt-try
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-mcp-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: python:3.13-slim
          command: ["python", "-B", "-u", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: sample-mcp-server
---
apiVersion: v1
kind: Service
metadata:
  name: sample-mcp-server
  namespace: kavrynt-try
spec:
  selector:
    app.kubernetes.io/name: sample-mcp-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: kavrynt.io/v1alpha1
kind: MCPServer
metadata:
  name: sample
  namespace: kavrynt-try
  annotations:
    kavrynt.io/description: Sample MCP server for trying Kavrynt
spec:
  version: 1.0.0
  transport: http
  endpoint: http://sample-mcp-server.kavrynt-try.svc.cluster.local:8080/mcp
