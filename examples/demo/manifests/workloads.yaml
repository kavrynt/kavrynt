# Demo MCP server workloads for docs/DEMO.md. scripts/demo-kind.sh replaces
# __DEMO_IMAGE__ with the locally built image.
apiVersion: v1
kind: Namespace
metadata:
  name: team-sre
  labels:
    kavrynt.io/demo: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidents
  namespace: team-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: incidents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incidents
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          image: __DEMO_IMAGE__
          imagePullPolicy: Never
          env:
            - name: DEMO_PROFILE
              value: incidents
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: incidents
  namespace: team-sre
spec:
  selector:
    app.kubernetes.io/name: incidents
  ports:
    - name: http
      port: 8080
      targetPort: http
---
