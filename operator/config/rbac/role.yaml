apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kavrynt-k8s-operator
rules:
  - apiGroups:
      - kavrynt.io
    resources:
      - mcpservers
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - kavrynt.io
    resources:
      - mcpservers/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - kavrynt.io
    resources:
      - mcpservers/finalizers
    verbs:
      - update
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
