image:
  repository: kavrynt/kavryctl
  tag: dev
  pullPolicy: IfNotPresent

job:
  command:
    - /usr/local/bin/kavryctl
  args:
    - version
  backoffLimit: 0
  restartPolicy: Never

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
