apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavrynt-k8s-operator
  namespace: kavrynt-system
  labels:
    app.kubernetes.io/name: k8s-operator
    app.kubernetes.io/part-of: kavrynt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-operator
        app.kubernetes.io/part-of: kavrynt
    spec:
      serviceAccountName: kavrynt-k8s-operator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: kavrynt/k8s-operator:dev
          imagePullPolicy: IfNotPresent
          args:
            - --registry-url
            - http://registry.default.svc.cluster.local:8080
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
