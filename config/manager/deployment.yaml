apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavrynt-k8s-operator
  namespace: kavrynt-system
  labels:
    app.kubernetes.io/name: k8s-operator
    app.kubernetes.io/part-of: kavrynt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-operator
        app.kubernetes.io/part-of: kavrynt
    spec:
      serviceAccountName: kavrynt-k8s-operator
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-kavrynt
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/kavrynt/operator:1.0.0-beta.4
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
          env:
            # Where single-label MCPServer endpoint hosts resolve
            # (SPEC-0029); the Gateway runs in the same namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
