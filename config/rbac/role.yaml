apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kavrynt-k8s-operator
rules:
  - apiGroups:
      - kavrynt.io
    resources:
      - mcpservers
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - kavrynt.io
    resources:
      - mcpservers/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - kavrynt.io
    resources:
      - mcpservers/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Whether a <service>.<namespace> endpoint names a namespace
  # (SPEC-0029-R04).
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
  # The pods of servers with session affinity, for tool discovery
  # (SPEC-0026-R09).
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
