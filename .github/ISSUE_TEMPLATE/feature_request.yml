name: Feature request
description: Propose a new capability or a change in behavior.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        User-visible changes are designed as specs before they are built ([specs/README.md](https://github.com/kavrynt/kavrynt/blob/develop/specs/README.md)). A clear problem statement here becomes the start of that spec.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [kavryctl, gateway, console, operator, helm chart, docs, other]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
