name: Publish GHCR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Gateway version embedded in the binary.
        required: true
        default: 0.1.0-beta
      image_tag:
        description: Mutable image tag to publish.
        required: true
        default: beta
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image metadata
        id: meta-vars
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            tag="${{ inputs.image_tag }}"
          else
            version="${GITHUB_REF_NAME#v}"
            tag="${GITHUB_REF_NAME#v}"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta-vars.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta-vars.outputs.build_date }}
          tags: |
            ${{ steps.meta-vars.outputs.image }}:${{ steps.meta-vars.outputs.version }}
            ${{ steps.meta-vars.outputs.image }}:${{ steps.meta-vars.outputs.tag }}
