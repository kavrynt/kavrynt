name: Secure QA

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STATICCHECK_VERSION: v0.8.0
  GOSEC_VERSION: v2.28.0
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  go:
    name: Go QA and SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          check-latest: true # take Go security patches the runner image has not cached yet
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check formatting
        run: make fmt-check

      - name: Unit tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Demo MCP server tests
        working-directory: examples/demo/mcp-server
        run: go test -race ./...

      - name: Console unit tests
        run: make console-test

      - name: Vet
        run: make vet

      - name: Staticcheck
        run: make lint STATICCHECK_VERSION="${STATICCHECK_VERSION}"

      - name: Gosec
        run: make sast GOSEC_VERSION="${GOSEC_VERSION}"

      - name: Govulncheck
        run: make vulncheck GOVULNCHECK_VERSION="${GOVULNCHECK_VERSION}"

      - name: Build binaries
        run: make build

      - name: Binary smoke tests
        run: |
          ./bin/kavryctl version
          ./bin/gateway --help
          ./bin/operator --help
          for manifest in examples/kavryctl/*; do ./bin/kavryctl validate "$manifest"; done

  source-scan:
    name: Trivy Source Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan source and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1

  helm:
    name: Helm and Release Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Verify release contract
        run: make release-contract

      - name: Verify specs and traceability
        run: make spec-check

      - name: Test alert rules and runbooks
        run: make alerts-test

      - name: Lint chart
        run: make helm-lint

      - name: Render chart
        run: make helm-template

      - name: Install helm-unittest
        run: make helm-plugins

      - name: Unit test chart
        run: make helm-unittest

  image:
    name: Image ${{ matrix.image }} and Trivy
    runs-on: ubuntu-latest
    needs: [go, source-scan, helm]
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, operator]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build OCI image archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: build/Dockerfile
          target: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
          tags: kavrynt/${{ matrix.image }}:ci
          provenance: false
          sbom: false

      - name: Extract OCI layout
        run: |
          mkdir -p "${{ runner.temp }}/image"
          tar -xf "${{ runner.temp }}/image.tar" -C "${{ runner.temp }}/image"

      - name: Scan AMD64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          input: ${{ runner.temp }}/image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1

      - name: Scan ARM64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: image
          input: ${{ runner.temp }}/image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1

  e2e:
    name: Kind End-to-End
    # Pinned: the console smoke test's Playwright (test/console-smoke) cannot
    # install its browser on ubuntu-latest (26.04). Move back to
    # ubuntu-latest together with a Playwright release that supports it.
    runs-on: ubuntu-24.04
    needs: [go, helm]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          check-latest: true # take Go security patches the runner image has not cached yet
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install Kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Pinned by test/console-smoke/package-lock.json; the browser comes
      # from Playwright's CDN for that exact version.
      - name: Install console smoke test
        run: |
          npm ci --prefix test/console-smoke --ignore-scripts --no-audit --no-fund
          npm exec --prefix test/console-smoke -- playwright install --with-deps chromium-headless-shell

      - name: Run end-to-end workflow
        env:
          E2E_BROWSER: "1"
        run: make e2e-kind
