name: Canonical Runtime QA

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Canonical Repositories and Umbrella Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: kavrynt

      - name: Checkout kavryctl
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kavrynt/kavryctl
          ref: develop
          path: kavryctl
          token: ${{ secrets.KAVRYNT_REPO_TOKEN }}

      - name: Checkout Registry
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kavrynt/registry
          ref: develop
          path: registry
          token: ${{ secrets.KAVRYNT_REPO_TOKEN }}

      - name: Checkout Gateway
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kavrynt/gateway
          ref: develop
          path: gateway
          token: ${{ secrets.KAVRYNT_REPO_TOKEN }}

      - name: Checkout Operator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kavrynt/operator
          ref: develop
          path: k8s-operator
          token: ${{ secrets.KAVRYNT_REPO_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Run canonical QA
        working-directory: kavrynt
        run: make qa
