name: QA

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  go:
    name: Go QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build binary
        run: |
          go build \
            -ldflags="-X github.com/kavrynt/kavryctl/internal/cli.Version=0.1.0-ci -X github.com/kavrynt/kavryctl/internal/cli.Commit=${GITHUB_SHA} -X github.com/kavrynt/kavryctl/internal/cli.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/kavryctl .

      - name: CLI smoke test
        run: |
          ./bin/kavryctl version
          ./bin/kavryctl validate examples/mcp-server.json

  vulnerability:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - go
      - vulnerability
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=0.1.0-ci \
            --build-arg COMMIT=${GITHUB_SHA} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t kavrynt/kavryctl:ci .

      - name: Image smoke test
        run: docker run --rm kavrynt/kavryctl:ci version

  helm:
    name: Helm QA
    runs-on: ubuntu-latest
    needs:
      - go
      - vulnerability
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/kavryctl

      - name: Render chart
        run: helm template kavryctl charts/kavryctl
