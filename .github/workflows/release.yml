name: Release Umbrella Chart

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  chart:
    name: Package Canonical Runtime Chart
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: kavrynt

      - name: Validate release tag
        working-directory: kavrynt
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)(\.[0-9]+)?$ ]]; then
            echo "Unsupported prerelease version: $version" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Checkout kavryctl release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kavrynt/kavryctl
          ref: ${{ github.ref_name }}
          path: kavryctl
          token: ${{ secrets.KAVRYNT_REPO_TOKEN }}

      - name: Checkout Registry release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kavrynt/registry
          ref: ${{ github.ref_name }}
          path: registry
          token: ${{ secrets.KAVRYNT_REPO_TOKEN }}

      - name: Checkout Gateway release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kavrynt/gateway
          ref: ${{ github.ref_name }}
          path: gateway
          token: ${{ secrets.KAVRYNT_REPO_TOKEN }}

      - name: Checkout Operator release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kavrynt/operator
          ref: ${{ github.ref_name }}
          path: k8s-operator
          token: ${{ secrets.KAVRYNT_REPO_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Build and lint chart
        working-directory: kavrynt
        run: |
          helm dependency build --skip-refresh charts/kavrynt
          helm lint charts/kavrynt
          helm template kavrynt charts/kavrynt --namespace kavrynt-system >/dev/null
          mkdir -p dist/charts
          helm package charts/kavrynt \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist/charts

      - name: Login to GHCR
        working-directory: kavrynt
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish chart
        working-directory: kavrynt
        run: helm push "dist/charts/kavrynt-${VERSION}.tgz" oci://ghcr.io/kavrynt/charts
