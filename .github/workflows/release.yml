name: Release Client Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)(\.[0-9]+)?$ ]]; then
            echo "Unsupported prerelease version: $version" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Verify source
        run: |
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.0 ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -exclude-dir=.cache ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="${GITHUB_REF_NAME#v}"
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          name="kavryctl_${version}_${GOOS}_${GOARCH}"
          binary="kavryctl"
          if [[ "$GOOS" == "windows" ]]; then binary="kavryctl.exe"; fi
          mkdir -p "dist/$name"
          go build \
            -trimpath \
            -ldflags="-s -w -X github.com/kavrynt/kavryctl/internal/cli.Version=${version} -X github.com/kavrynt/kavryctl/internal/cli.Commit=${GITHUB_SHA} -X github.com/kavrynt/kavryctl/internal/cli.BuildDate=${build_date}" \
            -o "dist/$name/$binary" .
          if [[ "$GOOS" == "windows" ]]; then
            (cd dist && zip -q -r "${name}.zip" "$name")
          else
            tar -C dist -czf "dist/${name}.tar.gz" "$name"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kavryctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/kavryctl_*.${{ matrix.goos == 'windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign and Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kavryctl-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum kavryctl_* > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Sign checksums
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --generate-notes \
            --title "kavryctl ${GITHUB_REF_NAME#v}"
