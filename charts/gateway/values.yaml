replicaCount: 1

image:
  repository: kavrynt/gateway
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

config:
  addr: ":8080"
  registryURL: "http://registry.default.svc.cluster.local:8080"
  syncInterval: "10s"
  requestTimeout: "30s"

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
