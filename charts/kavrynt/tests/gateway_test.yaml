suite: gateway
release:
  namespace: kavrynt-system
values:
  - values/open-routes.yaml
tests:
  # Verifies SPEC-0003-R06 and SPEC-0026-R12.
  - it: grants cluster-wide read-only access to MCPServers by default
    template: charts/gateway/templates/rbac.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups: [kavrynt.io]
              resources: [mcpservers]
              verbs: [get, list, watch]
            - apiGroups: [discovery.k8s.io]
              resources: [endpointslices]
              verbs: [get, list, watch]
        documentIndex: 0
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 1

  # Verifies SPEC-0003-R06 and SPEC-0026-R12.
  - it: grants per-namespace read-only access when namespaces are listed
    template: charts/gateway/templates/rbac.yaml
    set:
      global.watchNamespaces: [team-a, team-b]
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: Role
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: team-a
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups: [kavrynt.io]
              resources: [mcpservers]
              verbs: [get, list, watch]
            - apiGroups: [discovery.k8s.io]
              resources: [endpointslices]
              verbs: [get, list, watch]
        documentIndex: 0
      - isKind:
          of: RoleBinding
        documentIndex: 1
      - isKind:
          of: Role
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: team-b
        documentIndex: 2

  # Verifies SPEC-0003-R07.
  - it: hardens the Gateway container by default
    template: charts/gateway/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]

  # Verifies SPEC-0003-R07.
  - it: disables token automounting on the Gateway service account
    template: charts/gateway/templates/serviceaccount.yaml
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  # Verifies SPEC-0003-R08.
  - it: enables the console by default
    template: charts/gateway/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console=true

  # Verifies SPEC-0003-R08.
  - it: disables the console on request
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.console.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console=false

  # Verifies SPEC-0003-R09.
  - it: passes allowed origins and stripped headers as comma-separated flags
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.config.allowedOrigins:
        - https://a.example.com
        - https://b.example.com
      gateway.config.stripRequestHeaders:
        - X-Api-Key
        - X-Tenant
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --allowed-origins
      - contains:
          path: spec.template.spec.containers[0].args
          content: https://a.example.com,https://b.example.com
      - contains:
          path: spec.template.spec.containers[0].args
          content: --strip-request-headers
      - contains:
          path: spec.template.spec.containers[0].args
          content: X-Api-Key,X-Tenant

  # Verifies SPEC-0018-R06.
  - it: checks MCP requests strictly unless told not to
    template: charts/gateway/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --strict-protocol=true

  # Verifies SPEC-0018-R06.
  - it: forwards malformed MCP requests while clients migrate
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.config.strictProtocol: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --strict-protocol=false

  # Verifies SPEC-0038-R03.
  - it: limits MCP request bodies to 4 MiB by default
    template: charts/gateway/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --max-request-bytes
      - contains:
          path: spec.template.spec.containers[0].args
          content: "4194304"

  # Verifies SPEC-0038-R03.
  - it: passes a raised request size limit as a whole number
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.config.maxRequestBytes: 10485760
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "10485760"

  # Verifies SPEC-0003-R11.
  - it: refuses the removed gateway.config.watchNamespaces
    template: charts/gateway/templates/rbac.yaml
    set:
      gateway.config.watchNamespaces: [team-a]
    asserts:
      - failedTemplate:
          errorPattern: "replaced by global.watchNamespaces"
