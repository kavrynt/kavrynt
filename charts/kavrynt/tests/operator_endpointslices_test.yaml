suite: operator EndpointSlice access
templates:
  - charts/operator/templates/rbac.yaml
release:
  namespace: kavrynt-system
tests:
  # Verifies SPEC-0026-R09 and SPEC-0039-R05: the Operator may list and watch
  # EndpointSlices, to discover the tools of a server with session affinity
  # from one pod and to see where a Service's endpoints lead, and nothing
  # more on them.
  - it: lets the Operator list and watch EndpointSlices
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - contains:
          path: rules
          content:
            apiGroups: [discovery.k8s.io]
            resources: [endpointslices]
            verbs: [list, watch]

  # Verifies SPEC-0039-R05: read access to Services, and no write access.
  - it: lets the Operator read Services
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [services]
            verbs: [get, list, watch]
