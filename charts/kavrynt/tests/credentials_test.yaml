suite: upstream credentials
templates:
  - charts/gateway/templates/deployment.yaml
  - charts/operator/templates/deployment.yaml
  - charts/gateway/templates/rbac.yaml
  - charts/operator/templates/rbac.yaml
release:
  name: kavrynt
  namespace: kavrynt-system
tests:
  # Verifies SPEC-0011-R02.
  - it: mounts no credentials by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --upstream-credentials-dir=/etc/kavrynt/upstream-credentials
        template: charts/gateway/templates/deployment.yaml
      - notExists:
          path: spec.template.spec.volumes
        template: charts/operator/templates/deployment.yaml

  # Verifies SPEC-0011-R02.
  - it: mounts the Secret read-only into the Gateway and the Operator
    set:
      global.upstreamCredentials.secretName: kavrynt-upstream-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --upstream-credentials-dir=/etc/kavrynt/upstream-credentials
        template: charts/gateway/templates/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: upstream-credentials
            secret:
              secretName: kavrynt-upstream-credentials
              defaultMode: 0444
              optional: true
        template: charts/gateway/templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: upstream-credentials
            mountPath: /etc/kavrynt/upstream-credentials
            readOnly: true
        template: charts/gateway/templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --upstream-credentials-dir=/etc/kavrynt/upstream-credentials
        template: charts/operator/templates/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: upstream-credentials
            secret:
              secretName: kavrynt-upstream-credentials
              defaultMode: 0444
              optional: true
        template: charts/operator/templates/deployment.yaml

  # Verifies SPEC-0011-R02: mounting the Secret adds no RBAC on Secrets.
  - it: grants neither component access to Secrets
    set:
      global.upstreamCredentials.secretName: kavrynt-upstream-credentials
    asserts:
      - notContains:
          path: rules[0].resources
          content: secrets
        template: charts/gateway/templates/rbac.yaml
      - notContains:
          path: rules[0].resources
          content: secrets
        template: charts/operator/templates/rbac.yaml

  # Verifies SPEC-0011-R02.
  - it: rejects an invalid Secret name
    set:
      global.upstreamCredentials.secretName: Not_A_Name
    asserts:
      - failedTemplate: {}
        template: charts/gateway/templates/deployment.yaml
