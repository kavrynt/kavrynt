suite: tool authorization policy
templates:
  - charts/gateway/templates/deployment.yaml
release:
  name: kavrynt
  namespace: kavrynt-system
values:
  - values/open-routes.yaml
tests:
  # Verifies SPEC-0012-R01.
  - it: evaluates no policy by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --policy-dir=/etc/kavrynt/policy

  # Verifies SPEC-0012-R02.
  - it: mounts the policy ConfigMap and points the Gateway at it
    set:
      gateway.policy.enabled: true
      gateway.policy.configMap: kavrynt-policy
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --policy-dir=/etc/kavrynt/policy
      - contains:
          path: spec.template.spec.volumes
          content:
            name: policy
            configMap:
              name: kavrynt-policy
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: policy
            mountPath: /etc/kavrynt/policy
            readOnly: true

  # Verifies SPEC-0012-R02.
  - it: requires the ConfigMap name
    set:
      gateway.policy.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "policy.configMap is required when policy.enabled is true: the ConfigMap with the .rego files"
