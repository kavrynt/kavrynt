suite: operator RBAC
templates:
  - charts/operator/templates/rbac.yaml
release:
  name: kavrynt
  namespace: kavrynt-system
tests:
  # Leader election needs Leases only in the Operator's own namespace; a
  # cluster-wide grant would let the Operator rewrite every Lease, including
  # kube-system leader elections and node heartbeats.
  - it: grants no cluster-wide access to Leases
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - notContains:
          path: rules
          any: true
          content:
            apiGroups:
              - coordination.k8s.io

  - it: grants Leases in the release namespace only
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.namespace
          value: kavrynt-system
      - contains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: binds the Lease Role to the Operator's service account
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: metadata.namespace
          value: kavrynt-system
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: kavrynt-operator-leader-election
      - equal:
          path: subjects[0].namespace
          value: kavrynt-system

  # The Operator writes only MCPServer status. Write access to the objects
  # themselves would let it, or anyone holding its token, change every
  # team's endpoints and credentials. The whole rule list is pinned, so no
  # other rule, wildcard, or verb can be added unnoticed; a change here is a
  # change to the Operator's access and belongs in review.
  - it: grants exactly the cluster-wide access the Operator uses
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [kavrynt.io]
              resources: [mcpservers]
              verbs: [get, list, watch]
            - apiGroups: [kavrynt.io]
              resources: [mcpservers/status]
              verbs: [get, update]
            - apiGroups: [""]
              resources: [events]
              verbs: [create, patch]
            - apiGroups: [""]
              resources: [namespaces]
              verbs: [get]
            - apiGroups: [discovery.k8s.io]
              resources: [endpointslices]
              verbs: [list, watch]
            - apiGroups: [""]
              resources: [services]
              verbs: [get, list, watch]
