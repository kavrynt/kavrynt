suite: alerts
templates:
  - templates/prometheusrule.yaml
  - charts/operator/templates/service.yaml
  - charts/operator/templates/servicemonitor.yaml
release:
  name: kavrynt
  namespace: kavrynt-system
chart:
  version: 1.2.3
tests:
  # Verifies SPEC-0010-R02.
  - it: exposes the Operator's metrics through a Service by default
    template: charts/operator/templates/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: kavrynt-operator-metrics
      - equal:
          path: spec.ports[0]
          value:
            name: metrics
            port: 8080
            targetPort: metrics
            protocol: TCP
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: operator
            app.kubernetes.io/instance: kavrynt

  # Verifies SPEC-0010-R02.
  - it: renders an Operator ServiceMonitor only when asked
    template: charts/operator/templates/servicemonitor.yaml
    set:
      operator.metrics.serviceMonitor.enabled: true
      operator.metrics.serviceMonitor.labels:
        release: prometheus
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.labels.release
          value: prometheus
      - equal:
          path: spec.endpoints[0].port
          value: metrics

  # Verifies SPEC-0010-R02.
  - it: renders no Operator ServiceMonitor by default
    template: charts/operator/templates/servicemonitor.yaml
    asserts:
      - hasDocuments:
          count: 0

  # Verifies SPEC-0010-R03.
  - it: renders no alert rules by default
    template: templates/prometheusrule.yaml
    asserts:
      - hasDocuments:
          count: 0

  # Verifies SPEC-0010-R03.
  - it: renders every alert, without the Cloud alert while the connector is off
    template: templates/prometheusrule.yaml
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - isKind:
          of: PrometheusRule
      - lengthEqual:
          path: spec.groups[0].rules
          count: 4
      - equal:
          path: spec.groups[0].rules[0].alert
          value: KavryntGatewayDown
      - equal:
          path: spec.groups[0].rules[1].alert
          value: KavryntGatewayRouteSyncFailing
      - equal:
          path: spec.groups[0].rules[2].alert
          value: KavryntMCPUpstreamErrorsHigh
      - equal:
          path: spec.groups[0].rules[3].alert
          value: KavryntMCPLatencyHigh
      - lengthEqual:
          path: spec.groups[1].rules
          count: 2
      - equal:
          path: spec.groups[1].rules[0].alert
          value: KavryntOperatorDown
      - equal:
          path: spec.groups[1].rules[1].alert
          value: KavryntMCPServerNotReady

  # Verifies SPEC-0010-R03.
  - it: adds the Cloud sync alert when the connector is on
    template: templates/prometheusrule.yaml
    set:
      metrics.prometheusRule.enabled: true
      operator.cloud.enabled: true
      operator.cloud.url: https://cloud.example.com
      operator.cloud.tokenSecret.name: kavrynt-cloud-token
    asserts:
      - equal:
          path: spec.groups[1].rules[2].alert
          value: KavryntCloudSyncStale

  # Verifies SPEC-0010-R04.
  - it: labels every alert and links its runbook at the chart's release tag
    template: templates/prometheusrule.yaml
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - equal:
          path: spec.groups[0].rules[0].labels
          value:
            severity: critical
            component: gateway
      - equal:
          path: spec.groups[0].rules[2].labels
          value:
            severity: warning
            component: mcp-server
      - equal:
          path: spec.groups[0].rules[0].annotations.runbook_url
          value: https://github.com/kavrynt/kavrynt/blob/v1.2.3/docs/runbooks/KavryntGatewayDown.md
      - equal:
          path: spec.groups[1].rules[1].annotations.runbook_url
          value: https://github.com/kavrynt/kavrynt/blob/v1.2.3/docs/runbooks/KavryntMCPServerNotReady.md
      - exists:
          path: spec.groups[1].rules[1].annotations.summary
      - exists:
          path: spec.groups[1].rules[1].annotations.description

  # Verifies SPEC-0010-R05.
  - it: takes thresholds, jobs, and extra labels from values
    template: templates/prometheusrule.yaml
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.errorRatio: 0.2
      metrics.prometheusRule.latencyP95Seconds: 2
      metrics.prometheusRule.notReadyFor: 30m
      metrics.prometheusRule.jobs.gateway: kubernetes-pods
      metrics.prometheusRule.alertLabels:
        team: platform
        severity: page
      metrics.prometheusRule.labels:
        release: prometheus
    asserts:
      - equal:
          path: metadata.labels.release
          value: prometheus
      - matchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: '\) > 0\.2\n'
      - matchRegex:
          path: spec.groups[0].rules[3].expr
          pattern: '> 2$'
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'job="kubernetes-pods"'
      - equal:
          path: spec.groups[1].rules[1].for
          value: 30m
      # Extra labels are added; severity and component stay the chart's.
      - equal:
          path: spec.groups[1].rules[0].labels
          value:
            severity: critical
            component: operator
            team: platform

  # Verifies SPEC-0010-R05.
  - it: rejects an error ratio above 1
    template: templates/prometheusrule.yaml
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.errorRatio: 5
    asserts:
      - failedTemplate: {}
