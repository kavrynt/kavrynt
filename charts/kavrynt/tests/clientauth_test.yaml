suite: MCP client authentication
templates:
  - charts/gateway/templates/deployment.yaml
release:
  name: kavrynt
  namespace: kavrynt-system
tests:
  # Verifies SPEC-0014-R01 and SPEC-0014-R02.
  - it: refuses default values, naming both ways forward
    asserts:
      - failedTemplate:
          errorMessage: &refusal "gateway.auth: MCP client authentication is on by default. Set gateway.auth.resourceURL (the Gateway's external https origin) and gateway.auth.issuers to trust your authorization server, or set gateway.auth.enabled=false to run with unauthenticated MCP routes"

  # Verifies SPEC-0006-R01 and SPEC-0014-R01.
  - it: leaves MCP routes open only with the explicit opt-out
    set:
      gateway.auth.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --auth

  # Verifies SPEC-0006-R01.
  - it: passes the authentication settings to the Gateway
    set:
      gateway.auth.enabled: true
      gateway.auth.resourceURL: https://mcp.example.com/
      gateway.auth.issuers:
        - issuer: https://login.example.com/realms/agents
        - issuer: http://keycloak.auth.svc/realms/agents
          allowHTTP: true
      gateway.auth.requiredScopes: [mcp:tools]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --auth
      - contains:
          path: spec.template.spec.containers[0].args
          content: https://mcp.example.com
      - contains:
          path: spec.template.spec.containers[0].args
          content: '[{"issuer":"https://login.example.com/realms/agents"},{"allowHTTP":true,"issuer":"http://keycloak.auth.svc/realms/agents"}]'
      - contains:
          path: spec.template.spec.containers[0].args
          content: mcp:tools

  # Verifies SPEC-0006-R02 and SPEC-0014-R02.
  - it: refuses authentication without a resource URL
    set:
      gateway.auth.issuers:
        - issuer: https://login.example.com
    asserts:
      - failedTemplate:
          errorMessage: *refusal

  # Verifies SPEC-0006-R02 and SPEC-0014-R02.
  - it: refuses authentication without a trusted issuer
    set:
      gateway.auth.resourceURL: https://mcp.example.com
    asserts:
      - failedTemplate:
          errorMessage: *refusal

  # Verifies SPEC-0006-R02.
  - it: refuses a resource URL that is not an https origin
    set:
      gateway.auth.enabled: true
      gateway.auth.resourceURL: https://mcp.example.com/kavrynt
      gateway.auth.issuers:
        - issuer: https://login.example.com
    asserts:
      - failedTemplate: {}

  # Verifies SPEC-0006-R20.
  - it: refuses an http issuer unless allowHTTP is set
    set:
      gateway.auth.enabled: true
      gateway.auth.resourceURL: https://mcp.example.com
      gateway.auth.issuers:
        - issuer: http://keycloak.auth.svc/realms/agents
    asserts:
      - failedTemplate:
          errorMessage: "auth.issuers: http://keycloak.auth.svc/realms/agents uses http; set allowHTTP: true for an in-cluster authorization server"

  # Verifies SPEC-0006-R20.
  - it: refuses an http key URL unless allowHTTP is set
    set:
      gateway.auth.enabled: true
      gateway.auth.resourceURL: https://mcp.example.com
      gateway.auth.issuers:
        - issuer: https://login.example.com
          jwksURI: http://login.example.com/keys
    asserts:
      - failedTemplate: {}

  # Verifies SPEC-0006-R02.
  - it: rejects unknown issuer fields
    set:
      gateway.auth.enabled: true
      gateway.auth.resourceURL: https://mcp.example.com
      gateway.auth.issuers:
        - issuer: https://login.example.com
          audience: x
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'audience' not allowed"

  # Verifies SPEC-0015-R02: the token exchange Secret is mounted by the
  # kubelet, and the Gateway gets no RBAC on Secrets.
  - it: mounts the token exchange Secret read-only
    set:
      gateway.auth.resourceURL: https://mcp.example.com
      gateway.auth.issuers:
        - issuer: https://login.example.com
          tokenExchange:
            clientID: kavrynt-gateway
            clientSecretKey: client-secret
      gateway.auth.tokenExchangeSecret: kavrynt-token-exchange
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --token-exchange-secret-dir=/etc/kavrynt/token-exchange
      - contains:
          path: spec.template.spec.containers[0].args
          content: '[{"issuer":"https://login.example.com","tokenExchange":{"clientID":"kavrynt-gateway","clientSecretKey":"client-secret"}}]'
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: token-exchange
            mountPath: /etc/kavrynt/token-exchange
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: token-exchange
            secret:
              secretName: kavrynt-token-exchange
              defaultMode: 0444

  # Verifies SPEC-0015-R02.
  - it: refuses token exchange settings without their Secret
    set:
      gateway.auth.resourceURL: https://mcp.example.com
      gateway.auth.issuers:
        - issuer: https://login.example.com
          tokenExchange:
            clientID: kavrynt-gateway
            clientSecretKey: client-secret
    asserts:
      - failedTemplate:
          errorMessage: "auth.issuers: https://login.example.com has tokenExchange settings; set auth.tokenExchangeSecret to the Secret with its client secret"

  # Verifies SPEC-0015-R05.
  - it: refuses an http token endpoint unless allowHTTP is set
    set:
      gateway.auth.resourceURL: https://mcp.example.com
      gateway.auth.tokenExchangeSecret: kavrynt-token-exchange
      gateway.auth.issuers:
        - issuer: https://login.example.com
          tokenExchange:
            clientID: kavrynt-gateway
            clientSecretKey: client-secret
            tokenEndpoint: http://login.example.com/token
    asserts:
      - failedTemplate:
          errorMessage: "auth.issuers: https://login.example.com uses http; set allowHTTP: true for an in-cluster authorization server"

  # Verifies SPEC-0015-R02.
  - it: mounts no token exchange Secret without authentication
    set:
      gateway.auth.enabled: false
      gateway.auth.tokenExchangeSecret: kavrynt-token-exchange
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --token-exchange-secret-dir=/etc/kavrynt/token-exchange

  # Verifies SPEC-0031-R01: the Gateway audience is off by default.
  - it: accepts only each route's own audience by default
    set:
      gateway.auth.resourceURL: https://mcp.example.com
      gateway.auth.issuers:
        - issuer: https://login.example.com
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --auth-gateway-audience-routes

  # Verifies SPEC-0031-R01.
  - it: refuses the Gateway audience without MCP client authentication
    set:
      gateway.auth.enabled: false
      gateway.auth.gatewayAudience:
        enabled: true
        routes: [team-a.*]
    asserts:
      - failedTemplate:
          errorMessage: "gateway.auth.gatewayAudience: needs gateway.auth.enabled=true; without MCP client authentication routes take no tokens"

  # Verifies SPEC-0031-R02.
  - it: passes the Gateway audience routes to the Gateway
    set:
      gateway.auth.resourceURL: https://mcp.example.com
      gateway.auth.issuers:
        - issuer: https://login.example.com
      gateway.auth.gatewayAudience:
        enabled: true
        routes: [team-a.*, team-c.reports]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --auth-gateway-audience-routes
      - contains:
          path: spec.template.spec.containers[0].args
          content: team-a.*,team-c.reports

  # Verifies SPEC-0031-R02.
  - it: refuses the Gateway audience without routes
    set:
      gateway.auth.resourceURL: https://mcp.example.com
      gateway.auth.issuers:
        - issuer: https://login.example.com
      gateway.auth.gatewayAudience:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "gateway.auth.gatewayAudience.routes: list the routes one token may reach (<namespace>.<name> or <namespace>.*)"

  # Verifies SPEC-0031-R02.
  - it: refuses the Gateway audience for every route
    set:
      gateway.auth.resourceURL: https://mcp.example.com
      gateway.auth.issuers:
        - issuer: https://login.example.com
      gateway.auth.gatewayAudience:
        enabled: true
        routes: [team-a.*, "*"]
    asserts:
      - failedTemplate:
          errorMessage: "gateway.auth.gatewayAudience.routes: \"*\" is refused; list route names or <namespace>.* patterns, so a leaked token reaches only what you name"

  # Verifies SPEC-0031-R02: entries are route names or namespace patterns.
  - it: refuses Gateway audience entries that are not routes
    set:
      gateway.auth.resourceURL: https://mcp.example.com
      gateway.auth.issuers:
        - issuer: https://login.example.com
      gateway.auth.gatewayAudience:
        enabled: true
        routes: ["*.search"]
    asserts:
      - failedTemplate:
          errorPattern: gatewayAudience
