suite: console admin login
release:
  name: kavrynt
  namespace: kavrynt-system
values:
  - values/open-routes.yaml
tests:
  # Verifies SPEC-0005-R12.
  - it: generates the admin Secret by default and keeps it on uninstall
    template: charts/gateway/templates/console-auth-secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: kavrynt-gateway-console-admin
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      # base64 of 32 and 64 random alphanumeric characters.
      - matchRegex:
          path: data.password
          pattern: ^[A-Za-z0-9+/]{43}=$
      - matchRegex:
          path: data.sessionKey
          pattern: ^[A-Za-z0-9+/]{86}==$

  # Verifies SPEC-0005-R12.
  - it: keeps the existing password and key on upgrade
    template: charts/gateway/templates/console-auth-secret.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: kavrynt-gateway-console-admin
            namespace: kavrynt-system
          data:
            password: ZXhpc3RpbmctcGFzc3dvcmQ=
            sessionKey: ZXhpc3Rpbmcta2V5
    asserts:
      - equal:
          path: data.password
          value: ZXhpc3RpbmctcGFzc3dvcmQ=
      - equal:
          path: data.sessionKey
          value: ZXhpc3Rpbmcta2V5

  # Verifies SPEC-0005-R12.
  - it: enables the login and mounts the Secret read-only by default
    template: charts/gateway/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console-auth=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console-auth-dir=/etc/kavrynt/console-auth
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console-session-ttl=12h
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: console-auth
            mountPath: /etc/kavrynt/console-auth
            readOnly: true
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: kavrynt-gateway-console-admin

  # Verifies SPEC-0005-R13.
  - it: uses an existing Secret instead of generating one
    templates:
      - charts/gateway/templates/console-auth-secret.yaml
      - charts/gateway/templates/deployment.yaml
    set:
      gateway.console.auth.existingSecret: team-console-admin
      gateway.console.auth.sessionTTL: 30m
    asserts:
      - hasDocuments:
          count: 0
        template: charts/gateway/templates/console-auth-secret.yaml
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: team-console-admin
        template: charts/gateway/templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console-session-ttl=30m
        template: charts/gateway/templates/deployment.yaml

  # Verifies SPEC-0005-R13.
  - it: grants the Gateway no RBAC on Secrets with the login on
    template: charts/gateway/templates/rbac.yaml
    set:
      gateway.console.auth.existingSecret: team-console-admin
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [kavrynt.io]
              resources: [mcpservers]
              verbs: [get, list, watch]
            - apiGroups: [discovery.k8s.io]
              resources: [endpointslices]
              verbs: [get, list, watch]
        documentIndex: 0

  # Verifies SPEC-0005-R03.
  - it: turns the login off without a Secret or mount
    templates:
      - charts/gateway/templates/console-auth-secret.yaml
      - charts/gateway/templates/deployment.yaml
    set:
      gateway.console.auth.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: charts/gateway/templates/console-auth-secret.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console-auth=false
        template: charts/gateway/templates/deployment.yaml
      # Only the console alert thresholds are mounted (SPEC-0020-R03).
      - equal:
          path: spec.template.spec.volumes[*].name
          value: console-alerts
        template: charts/gateway/templates/deployment.yaml

  - it: has no login when the console is off
    templates:
      - charts/gateway/templates/console-auth-secret.yaml
      - charts/gateway/templates/deployment.yaml
    set:
      gateway.console.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: charts/gateway/templates/console-auth-secret.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console-auth=false
        template: charts/gateway/templates/deployment.yaml

  - it: rejects an invalid session lifetime and unknown login keys
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.console.auth.sessionTTL: forever
    asserts:
      - failedTemplate: {}

  - it: rejects a mistyped login key
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.console.auth.passwrd: x
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'passwrd' not allowed"

  # Verifies SPEC-0030-R01.
  - it: passes trusted proxies to the Gateway only when set
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.console.auth.trustedProxies: [10.0.0.0/8, "fd00::/8"]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console-trusted-proxies=10.0.0.0/8,fd00::/8

  # Verifies SPEC-0030-R01.
  - it: rejects a trusted proxy that is not a CIDR
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.console.auth.trustedProxies: [10.0.0.1]
    asserts:
      - failedTemplate: {}

  # Verifies SPEC-0032-R01 and SPEC-0032-R02: console sign-in passes its
  # settings without the client secret, which is a mounted file.
  - it: passes console sign-in settings and mounts the client secret
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.auth.enabled: false
      gateway.console.auth.oidc:
        enabled: true
        issuer: https://login.example.com/realms/agents
        clientID: kavrynt-console
        clientSecret: {name: console-oidc, key: secret}
        redirectURL: https://mcp.example.com/v1/session/oidc/callback
        providerName: Keycloak
        allowedGroups: [platform]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console-oidc-secret-file=/etc/kavrynt/console-oidc/secret
      - contains:
          path: spec.template.spec.volumes
          content:
            name: console-oidc
            secret: {secretName: console-oidc, defaultMode: 0444}
      # The exact settings: no clientSecret.
      - contains:
          path: spec.template.spec.containers[0].args
          content: '{"allowHTTP":false,"allowedGroups":["platform"],"allowedSubjects":[],"clientID":"kavrynt-console","displayClaim":"preferred_username","groupsClaim":"groups","issuer":"https://login.example.com/realms/agents","keepAdminLogin":false,"providerName":"Keycloak","redirectURL":"https://mcp.example.com/v1/session/oidc/callback","scopes":[]}'

  # Verifies SPEC-0032-R01: incomplete settings are refused at render.
  - it: refuses console sign-in without the console login
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.auth.enabled: false
      gateway.console.auth.enabled: false
      gateway.console.auth.oidc: {enabled: true, issuer: https://login.example.com, clientID: c, clientSecret: {name: s}, redirectURL: https://mcp.example.com/v1/session/oidc/callback, allowedGroups: [platform]}
    asserts:
      - failedTemplate:
          errorPattern: needs gateway.console.enabled and gateway.console.auth.enabled

  # Verifies SPEC-0032-R01.
  - it: refuses console sign-in without an allow list
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.auth.enabled: false
      gateway.console.auth.oidc: {enabled: true, issuer: https://login.example.com, clientID: c, clientSecret: {name: s}, redirectURL: https://mcp.example.com/v1/session/oidc/callback}
    asserts:
      - failedTemplate:
          errorPattern: list allowedSubjects or allowedGroups

  # Verifies SPEC-0032-R01.
  - it: refuses console sign-in without its settings or with an http issuer
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.auth.enabled: false
      gateway.console.auth.oidc: {enabled: true, issuer: http://keycloak.idp.svc:8080/realms/a, clientID: c, clientSecret: {name: s}, redirectURL: https://mcp.example.com/v1/session/oidc/callback, allowedGroups: [platform]}
    asserts:
      - failedTemplate:
          errorPattern: issuer uses http

  # Verifies SPEC-0032-R01: the redirect URL is the Gateway's https callback.
  - it: refuses a redirect URL that is not the https callback
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.auth.enabled: false
      gateway.console.auth.oidc: {enabled: true, issuer: https://login.example.com, clientID: c, clientSecret: {name: s}, redirectURL: http://mcp.example.com/callback, allowedGroups: [platform]}
    asserts:
      - failedTemplate:
          errorPattern: redirectURL
