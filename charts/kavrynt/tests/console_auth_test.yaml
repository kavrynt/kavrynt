suite: console admin login
release:
  name: kavrynt
  namespace: kavrynt-system
values:
  - values/open-routes.yaml
tests:
  # Verifies SPEC-0005-R12.
  - it: generates the admin Secret by default and keeps it on uninstall
    template: charts/gateway/templates/console-auth-secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: kavrynt-gateway-console-admin
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      # base64 of 32 and 64 random alphanumeric characters.
      - matchRegex:
          path: data.password
          pattern: ^[A-Za-z0-9+/]{43}=$
      - matchRegex:
          path: data.sessionKey
          pattern: ^[A-Za-z0-9+/]{86}==$

  # Verifies SPEC-0005-R12.
  - it: keeps the existing password and key on upgrade
    template: charts/gateway/templates/console-auth-secret.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: kavrynt-gateway-console-admin
            namespace: kavrynt-system
          data:
            password: ZXhpc3RpbmctcGFzc3dvcmQ=
            sessionKey: ZXhpc3Rpbmcta2V5
    asserts:
      - equal:
          path: data.password
          value: ZXhpc3RpbmctcGFzc3dvcmQ=
      - equal:
          path: data.sessionKey
          value: ZXhpc3Rpbmcta2V5

  # Verifies SPEC-0005-R12.
  - it: enables the login and mounts the Secret read-only by default
    template: charts/gateway/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console-auth=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console-auth-dir=/etc/kavrynt/console-auth
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console-session-ttl=12h
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: console-auth
              mountPath: /etc/kavrynt/console-auth
              readOnly: true
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: kavrynt-gateway-console-admin

  # Verifies SPEC-0005-R13.
  - it: uses an existing Secret instead of generating one
    templates:
      - charts/gateway/templates/console-auth-secret.yaml
      - charts/gateway/templates/deployment.yaml
    set:
      gateway.console.auth.existingSecret: team-console-admin
      gateway.console.auth.sessionTTL: 30m
    asserts:
      - hasDocuments:
          count: 0
        template: charts/gateway/templates/console-auth-secret.yaml
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: team-console-admin
        template: charts/gateway/templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console-session-ttl=30m
        template: charts/gateway/templates/deployment.yaml

  # Verifies SPEC-0005-R13.
  - it: grants the Gateway no RBAC on Secrets with the login on
    template: charts/gateway/templates/rbac.yaml
    set:
      gateway.console.auth.existingSecret: team-console-admin
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [kavrynt.io]
              resources: [mcpservers]
              verbs: [get, list, watch]
        documentIndex: 0

  # Verifies SPEC-0005-R03.
  - it: turns the login off without a Secret or mount
    templates:
      - charts/gateway/templates/console-auth-secret.yaml
      - charts/gateway/templates/deployment.yaml
    set:
      gateway.console.auth.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: charts/gateway/templates/console-auth-secret.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console-auth=false
        template: charts/gateway/templates/deployment.yaml
      - notExists:
          path: spec.template.spec.volumes
        template: charts/gateway/templates/deployment.yaml

  - it: has no login when the console is off
    templates:
      - charts/gateway/templates/console-auth-secret.yaml
      - charts/gateway/templates/deployment.yaml
    set:
      gateway.console.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: charts/gateway/templates/console-auth-secret.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --console-auth=false
        template: charts/gateway/templates/deployment.yaml

  - it: rejects an invalid session lifetime and unknown login keys
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.console.auth.sessionTTL: forever
    asserts:
      - failedTemplate: {}

  - it: rejects a mistyped login key
    template: charts/gateway/templates/deployment.yaml
    set:
      gateway.console.auth.passwrd: x
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'passwrd' not allowed"
