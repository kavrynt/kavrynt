apiVersion: v2
name: kavrynt
description: Kubernetes-native control plane for registering, discovering, and routing Model Context Protocol (MCP) servers
type: application
version: 1.0.0-beta.5
appVersion: 1.0.0-beta.5
home: https://github.com/kavrynt/kavrynt
icon: https://raw.githubusercontent.com/kavrynt/kavrynt/main/internal/gateway/console/static/logo.svg
sources:
  - https://github.com/kavrynt/kavrynt
keywords:
  - mcp
  - model-context-protocol
  - ai-agents
  - gateway
  - operator
maintainers:
  - name: Ravindra Kumar
    url: https://github.com/Ravi041
dependencies:
  - name: gateway
    version: 1.0.0-beta.5
    repository: file://charts/gateway
  - name: k8s-operator
    alias: operator
    version: 1.0.0-beta.5
    repository: file://charts/k8s-operator
# Artifact Hub metadata: https://artifacthub.io/docs/topics/annotations/helm/
# Image tags and the prerelease flag are part of the release contract
# (scripts/verify-release-contract.sh).
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/prerelease: "true"
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Basic Install
  artifacthub.io/images: |
    - name: gateway
      image: docker.io/kavrynt/gateway:1.0.0-beta.5
    - name: operator
      image: docker.io/kavrynt/operator:1.0.0-beta.5
  artifacthub.io/crds: |
    - kind: MCPServer
      version: v1alpha1
      name: mcpservers.kavrynt.io
      displayName: MCP Server
      description: An MCP server endpoint that the Operator validates and the Gateway routes.
  artifacthub.io/crdsExamples: |
    - apiVersion: kavrynt.io/v1alpha1
      kind: MCPServer
      metadata:
        name: example-mcp-server
        namespace: default
      spec:
        version: 0.1.0
        transport: http
        endpoint: http://example-mcp-server.default.svc.cluster.local:8080
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/kavrynt/kavrynt#readme
    - name: Roadmap
      url: https://github.com/kavrynt/kavrynt/blob/main/ROADMAP.md
    - name: Security policy
      url: https://github.com/kavrynt/kavrynt/blob/main/SECURITY.md
