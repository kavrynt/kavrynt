{{- if .Values.metrics.service.enabled }}
# Metrics only; the Operator serves no other traffic (SPEC-0010-R02).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-operator.fullname" . }}-metrics
  labels:
    {{- include "k8s-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "k8s-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
{{- end }}
