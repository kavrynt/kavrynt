{{- $cloud := .Values.cloud | default dict }}
{{- $credentials := (((.Values.global | default dict).upstreamCredentials | default dict).secretName) }}
{{- if $cloud.enabled }}
{{- if not (hasPrefix "https://" ($cloud.url | default "")) }}
{{- fail "cloud.url must be an https URL when cloud.enabled is true" }}
{{- end }}
{{- if not ($cloud.tokenSecret | default dict).name }}
{{- fail "cloud.tokenSecret.name is required when cloud.enabled is true" }}
{{- end }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) (not .Values.config.leaderElect) }}
{{- fail "replicaCount above 1 requires config.leaderElect: true, or every replica would reconcile" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-operator.fullname" . }}
  labels:
    {{- include "k8s-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "k8s-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "k8s-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "k8s-operator.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address
            - {{ .Values.config.metricsBindAddress | quote }}
            - --health-probe-bind-address
            - {{ .Values.config.healthProbeBindAddress | quote }}
            {{- if .Values.config.leaderElect }}
            - --leader-elect
            {{- end }}
            - --tool-discovery={{ .Values.config.toolDiscovery.enabled }}
            - --tool-refresh-interval
            - {{ .Values.config.toolDiscovery.refreshInterval | quote }}
            {{- if $cloud.enabled }}
            - --cloud-sync
            - --cloud-url
            - {{ $cloud.url | quote }}
            - --cloud-token-file
            - /var/run/secrets/kavrynt/cloud/token
            - --cloud-sync-interval
            - {{ $cloud.syncInterval | default "60s" | quote }}
            {{- end }}
            {{- with join "," ((.Values.global | default dict).watchNamespaces | default list) }}
            - --gateway-watch-namespaces
            - {{ . | quote }}
            {{- end }}
            {{- if $credentials }}
            - --upstream-credentials-dir=/etc/kavrynt/upstream-credentials
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or $cloud.enabled $credentials }}
          volumeMounts:
            {{- if $cloud.enabled }}
            - name: cloud-token
              mountPath: /var/run/secrets/kavrynt/cloud
              readOnly: true
            {{- end }}
            {{- if $credentials }}
            # Upstream credentials for tool discovery (SPEC-0011); mounted by the
            # kubelet, the Operator has no RBAC on Secrets.
            - name: upstream-credentials
              mountPath: /etc/kavrynt/upstream-credentials
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $cloud.enabled $credentials }}
      volumes:
        {{- if $cloud.enabled }}
        - name: cloud-token
          secret:
            secretName: {{ $cloud.tokenSecret.name | quote }}
            items:
              - key: {{ $cloud.tokenSecret.key | default "token" | quote }}
                path: token
        {{- end }}
        {{- if $credentials }}
        - name: upstream-credentials
          secret:
            secretName: {{ $credentials | quote }}
            defaultMode: 0444
            # Pods start before the Secret exists; until then credentialed
            # servers answer 503 and their discovery reports the key missing.
            optional: true
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
