apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpservers.kavrynt.io
spec:
  group: kavrynt.io
  scope: Namespaced
  names:
    plural: mcpservers
    singular: mcpserver
    kind: MCPServer
    shortNames:
      - mcps
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - version
                - transport
              x-kubernetes-validations:
                - rule: "self.transport != 'http' || has(self.endpoint)"
                  message: "spec.endpoint is required when spec.transport is http"
                - rule: "self.transport != 'stdio' || has(self.command)"
                  message: "spec.command is required when spec.transport is stdio"
                - rule: "!has(self.endpoint) || self.endpoint.matches('^https?://[^/?#@\\\\s]+([/?].*)?$')"
                  message: "spec.endpoint must be an absolute http or https URL without credentials"
                - rule: "!has(self.credential) || self.transport == 'http'"
                  message: "spec.credential is only supported with spec.transport http"
                - rule: "!has(self.credential) || !has(self.credential.header) || !(self.credential.header.lowerAscii() in ['host', 'content-length', 'content-type', 'transfer-encoding', 'connection', 'keep-alive', 'te', 'trailer', 'upgrade', 'proxy-connection', 'cookie', 'x-kavrynt-route', 'x-forwarded-host'] || self.credential.header.lowerAscii().startsWith('mcp-'))"
                  message: "spec.credential.header must not frame or route the request, be a cookie, or be an MCP protocol header"
                - rule: "!has(self.tokenExchange) || self.transport == 'http'"
                  message: "spec.tokenExchange is only supported with spec.transport http"
                - rule: "!(has(self.tokenExchange) && has(self.credential))"
                  message: "spec.tokenExchange and spec.credential are mutually exclusive"
              properties:
                version:
                  type: string
                  minLength: 1
                transport:
                  type: string
                  enum:
                    - http
                    - stdio
                command:
                  type: string
                args:
                  type: array
                  items:
                    type: string
                endpoint:
                  type: string
                  maxLength: 2048
                environment:
                  type: object
                  additionalProperties:
                    type: string
                credential:
                  type: object
                  description: The endpoint needs a credential, stored by the platform team in the Kavrynt upstream credentials Secret.
                  properties:
                    header:
                      type: string
                      maxLength: 128
                      pattern: "^[A-Za-z0-9!#$%&'*+.^_`|~-]+$"
                    scheme:
                      type: string
                      maxLength: 128
                      pattern: "^[A-Za-z0-9!#$%&'*+.^_`|~-]+$"
                tokenExchange:
                  type: object
                  description: The Gateway exchanges each caller's access token for one with this audience (RFC 8693) and sends only that token.
                  required:
                    - audience
                  properties:
                    audience:
                      type: string
                      minLength: 1
                      maxLength: 2048
                      pattern: "^[A-Za-z][A-Za-z0-9+.-]*:[^#\\s]+$"
                    scopes:
                      type: array
                      maxItems: 20
                      items:
                        type: string
                        maxLength: 256
                        pattern: "^[\\x21\\x23-\\x5b\\x5d-\\x7e]+$"
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                tools:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        maxLength: 128
                      description:
                        type: string
                        maxLength: 1024
                      inputSchema:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      annotations:
                        type: object
                        properties:
                          readOnlyHint:
                            type: boolean
                          destructiveHint:
                            type: boolean
                          idempotentHint:
                            type: boolean
                          openWorldHint:
                            type: boolean
                serverInfo:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 128
                    version:
                      type: string
                      maxLength: 128
      additionalPrinterColumns:
        - name: Transport
          type: string
          jsonPath: .spec.transport
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Reported
          type: string
          jsonPath: .status.serverInfo.version
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Discovery
          type: string
          jsonPath: .status.conditions[?(@.type=="ToolsDiscovered")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
