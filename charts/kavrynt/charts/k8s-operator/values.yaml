replicaCount: 1

# PodDisruptionBudget, rendered when replicaCount is above 1. Standby
# replicas take over through leader election.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

image:
  repository: kavrynt/operator
  tag: 1.0.0-beta.2
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

# The MCPServer CustomResourceDefinition. Helm installs and upgrades it with
# the chart. Set install to false when CRDs are managed outside this release
# (apply charts/k8s-operator/files/kavrynt.io_mcpservers.yaml yourself).
crds:
  install: true
  # Keep the CRD, and with it every MCPServer, on helm uninstall and rollback.
  keep: true

config:
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  leaderElect: true
  # The Operator lists the tools of Ready MCPServers (MCP tools/list) into
  # status. It needs network access to each server's spec.endpoint and sends
  # only the server's stored upstream credential (spec.credential), to its
  # pinned origin. Disable where the Operator must not reach MCP servers.
  toolDiscovery:
    enabled: true
    refreshInterval: 5m

# Operator metrics (controller-runtime, kavrynt_operator_mcpserver_ready,
# kavrynt_operator_mcpserver_tools_discovered, and the Cloud connector) on the
# metrics port. The Service lets the Prometheus Operator scrape them; only the
# leader exports MCPServer readiness and discovery.
metrics:
  service:
    enabled: true
  # ServiceMonitor for the Prometheus Operator (requires its CRDs).
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# Kavrynt Cloud connector: sends every MCPServer and its discovered tools to
# Kavrynt Cloud. Off by default. Create the Secret first, for example:
#   kubectl create secret generic kavrynt-cloud-token --from-literal=token=<cluster token>
# The token's tenant and cluster come from Cloud; nothing here sets them.
cloud:
  enabled: false
  # Kavrynt Cloud base URL; https only.
  url: ""
  tokenSecret:
    # Secret in the release namespace holding the cluster token.
    name: ""
    key: token
  syncInterval: 60s

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
