replicaCount: 1

image:
  repository: kavrynt/registry
  tag: 0.0.1-beta.1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

config:
  addr: ":8080"
  dataPath: "/data/registry.json"

storage:
  emptyDir: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
