replicaCount: 1

# HorizontalPodAutoscaler on CPU utilisation (needs metrics-server). When on,
# the HPA owns the replica count and replicaCount is ignored.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# PodDisruptionBudget, rendered when more than one replica runs (replicaCount
# above 1 or autoscaling on), so a node drain never takes every replica.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Pod topology spread. Empty uses a soft spread across nodes and zones when
# more than one replica runs.
topologySpreadConstraints: []

image:
  repository: kavrynt/gateway
  tag: 1.0.0-beta.2
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

rbac:
  # Grants read-only access (get, list, watch) to MCPServer resources.
  create: true

service:
  type: ClusterIP
  port: 8080

config:
  addr: ":8080"
  requestTimeout: "30s"
  # Extra request headers never forwarded to MCP servers. Authorization,
  # Cookie, and Proxy-Authorization are always removed (no token passthrough).
  stripRequestHeaders: []
  # Browser origins (scheme://host[:port]) allowed to call the Gateway, besides
  # loopback origins such as a port-forward. Requests from other origins are
  # rejected (MCP DNS-rebinding protection). Add the URL of any Ingress that
  # serves the console, for example https://kavrynt.example.com.
  allowedOrigins: []
  # On shutdown the Gateway fails /readyz, keeps serving for shutdownDelay so
  # the Service stops sending it requests, then waits up to shutdownTimeout for
  # in-flight requests. Whole seconds; the pod's termination grace period is
  # derived from both.
  shutdownDelay: 5s
  shutdownTimeout: 10s
  # Refuse MCP requests that are not well-formed MCP Streamable HTTP
  # (SPEC-0018): an unsupported MCP-Protocol-Version, JSON-RPC batches, and
  # Mcp-Method or Mcp-Name headers that disagree with the body. Set false
  # only while migrating clients; such requests are then forwarded.
  strictProtocol: true

# MCP client authentication (SPEC-0006): the Gateway is an OAuth 2.1 resource
# server. Every /mcp/ request needs a bearer access token (a JWT) from a
# trusted authorization server, whose audience is the route's resource URI,
# <resourceURL>/mcp/<namespace>.<name>. Clients discover where to get one from
# the 401 answer and /.well-known/oauth-protected-resource/mcp/<route>.
# On by default (SPEC-0014): set resourceURL and issuers, or set
# enabled: false to run with unauthenticated MCP routes, for example for a
# local trial.
auth:
  enabled: true
  # The Gateway's external https origin, as clients reach it (no path), for
  # example https://mcp.example.com.
  resourceURL: ""
  # Trusted authorization servers, normally your identity provider.
  issuers: []
  # - issuer: https://login.example.com/realms/agents   # must equal the tokens' iss
  #   jwksURI: ""        # optional; discovered from the issuer's metadata
  #   allowHTTP: false   # true only for an in-cluster authorization server on http
  #   tokenExchange:     # optional: exchange callers' tokens for servers
  #     clientID: kavrynt-gateway       # that declare spec.tokenExchange
  #     clientSecretKey: client-secret  # key in tokenExchangeSecret
  #     tokenEndpoint: ""               # optional; from the issuer's metadata
  # Scopes every token must carry, for example [mcp:tools].
  requiredScopes: []
  # Secret in the release namespace with the Gateway's client secrets for
  # token exchange (SPEC-0015), one key per issuer's clientSecretKey. The
  # kubelet mounts it; the Gateway gets no RBAC on Secrets.
  tokenExchangeSecret: ""

# Audit events (SPEC-0013): one JSON line per MCP request on the Gateway's
# standard output ("type":"kavrynt.audit.v1"), with the caller, route, method,
# tool, decision, and outcome, never arguments, results, or tokens. Chained
# with SHA-256 per Gateway instance; check with kavryctl audit verify.
audit:
  enabled: false
  queueSize: 10000
  # With a full queue: reject (refuse new MCP requests with 503; no call is
  # served without its record) or drop (serve them, count the lost events).
  onOverflow: reject
  # Deliver the events to Kavrynt Cloud as well (SPEC-0017), in batches over
  # HTTPS with the cluster token, so their chains can be checked outside the
  # cluster. Events include the caller's subject and client ID. Standard
  # output keeps every event. Use the same URL and Secret as operator.cloud.
  cloud:
    enabled: false
    # Kavrynt Cloud base URL; https only.
    url: ""
    tokenSecret:
      # Secret in the release namespace holding the cluster token.
      name: ""
      key: token
    # Undelivered events kept while Cloud is unreachable; when full, the
    # oldest are dropped and counted.
    bufferSize: 100000

# Tool authorization policy (SPEC-0012): every MCP request is allowed or
# denied by Rego policy evaluated in the Gateway (Open Policy Agent). The
# ConfigMap holds .rego files defining data.kavrynt.authz.decision; anything
# but {"allow": true} denies. A policy that does not compile stops the
# Gateway at start; a bad update keeps the last good policy. Restrict who can
# edit the ConfigMap: it controls authorization. Examples: examples/policy.
policy:
  enabled: false
  configMap: ""
  # List in each tools/list answer only the tools the policy lets that
  # caller call (SPEC-0016). Answers the filter cannot finish within 500 ms,
  # or larger than 1 MiB, list no tools.
  filterToolsList: false

# Read-only web console at /ui/: MCP servers and their tools, a playground that
# calls tools through the Gateway, and recent traffic. It needs no extra RBAC.
console:
  enabled: true
  # Admin login for the console and the endpoints it reads (/v1/servers,
  # /v1/traffic), like Argo CD's initial admin password. Username: admin.
  # Password: kubectl -n <namespace> get secret <release>-gateway-console-admin
  #   -o jsonpath='{.data.password}' | base64 -d
  # It does not protect MCP routes; MCP client authentication (auth) does.
  auth:
    enabled: true
    # Secret with keys "password" and "sessionKey" to use instead of the
    # generated one. Set it when the chart is rendered without cluster access
    # (helm template, GitOps), where a generated password would change on
    # every render.
    existingSecret: ""
    # Session lifetime; changing the password also ends every session.
    sessionTTL: 12h
    # CIDRs of the proxies (Ingress controller, load balancer) in front of
    # the Gateway. Failed logins from them count against the client their
    # X-Forwarded-For names, not against the proxy (SPEC-0030). List only
    # the proxies: an address listed here can name any client.
    trustedProxies: []
  # Dashboards (SPEC-0024): each replica keeps 24 hours of its own calls in
  # memory, about 29 KiB per route and 23 KiB per tool (about 27 MiB for
  # 300 routes with the default cap).
  history:
    # Tools charted on their own, across routes; further tools count as
    # their route's "other" tool.
    maxTools: 500
  # Grafana base URL (http or https) the dashboards link for cluster-wide
  # history, for example https://grafana.example.com. Empty names the
  # Grafana dashboards (metrics.dashboard.enabled) instead.
  grafanaURL: ""

# MCP traffic metrics on /metrics: requests, outcomes, and latency per MCP
# server, method, and tool. Metadata only; bodies are never recorded.
metrics:
  # prometheus.io/* pod annotations for Prometheus annotation-based discovery.
  scrapeAnnotations: true
  # ServiceMonitor for the Prometheus Operator (requires its CRDs).
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # ConfigMap with the "Kavrynt MCP Traffic" and "Kavrynt MCP Server" Grafana
  # dashboards, picked up by the Grafana dashboard sidecar through the labels
  # below.
  dashboard:
    enabled: false
    # Namespace the sidecar watches; empty uses the release namespace.
    namespace: ""
    labels:
      grafana_dashboard: "1"
    # Your own dashboards, released with the chart: file name (<name>.json)
    # to dashboard JSON, as a string (--set-file) or an object. Each becomes
    # a ConfigMap with the labels above.
    extra: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
