replicaCount: 1

image:
  repository: kavrynt/gateway
  tag: 0.0.5-beta.1
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

rbac:
  # Grants read-only access (get, list, watch) to MCPServer resources.
  create: true

service:
  type: ClusterIP
  port: 8080

config:
  addr: ":8080"
  requestTimeout: "30s"
  # Extra request headers never forwarded to MCP servers. Authorization,
  # Cookie, and Proxy-Authorization are always removed (no token passthrough).
  stripRequestHeaders: []
  # Browser origins (scheme://host[:port]) allowed to call the Gateway, besides
  # loopback origins such as a port-forward. Requests from other origins are
  # rejected (MCP DNS-rebinding protection). Add the URL of any Ingress that
  # serves the console, for example https://kavrynt.example.com.
  allowedOrigins: []

# Read-only web console at /ui/: MCP servers and their tools, a playground that
# calls tools through the Gateway, and recent traffic. It needs no extra RBAC.
console:
  enabled: true
  # Admin login for the console and the endpoints it reads (/v1/servers,
  # /v1/traffic), like Argo CD's initial admin password. Username: admin.
  # Password: kubectl -n <namespace> get secret <release>-gateway-console-admin
  #   -o jsonpath='{.data.password}' | base64 -d
  # It does not protect MCP routes: anyone who can reach the Gateway can still
  # call every routed tool (client authentication is not implemented yet).
  auth:
    enabled: true
    # Secret with keys "password" and "sessionKey" to use instead of the
    # generated one. Set it when the chart is rendered without cluster access
    # (helm template, GitOps), where a generated password would change on
    # every render.
    existingSecret: ""
    # Session lifetime; changing the password also ends every session.
    sessionTTL: 12h

# MCP traffic metrics on /metrics: requests, outcomes, and latency per MCP
# server, method, and tool. Metadata only; bodies are never recorded.
metrics:
  # prometheus.io/* pod annotations for Prometheus annotation-based discovery.
  scrapeAnnotations: true
  # ServiceMonitor for the Prometheus Operator (requires its CRDs).
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # ConfigMap with the "Kavrynt MCP Traffic" Grafana dashboard, picked up by
  # the Grafana dashboard sidecar through the labels below.
  dashboard:
    enabled: false
    # Namespace the sidecar watches; empty uses the release namespace.
    namespace: ""
    labels:
      grafana_dashboard: "1"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
