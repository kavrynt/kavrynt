{{- $credentials := (((.Values.global | default dict).upstreamCredentials | default dict).secretName) }}
{{- $policy := .Values.policy | default dict }}
{{- $exchange := "" }}
{{- if include "gateway.clientAuthEnabled" . }}
{{- $exchange = .Values.auth.tokenExchangeSecret | default "" }}
{{- end }}
{{- if and $policy.enabled (not $policy.configMap) }}
{{- fail "policy.configMap is required when policy.enabled is true: the ConfigMap with the .rego files" }}
{{- end }}
{{- $auditCloud := ((.Values.audit | default dict).cloud | default dict) }}
{{- if $auditCloud.enabled }}
{{- if not .Values.audit.enabled }}
{{- fail "audit.cloud.enabled needs audit.enabled: only written audit events are delivered" }}
{{- end }}
{{- if not (hasPrefix "https://" ($auditCloud.url | default "")) }}
{{- fail "audit.cloud.url must be an https URL when audit.cloud.enabled is true" }}
{{- end }}
{{- if not ($auditCloud.tokenSecret | default dict).name }}
{{- fail "audit.cloud.tokenSecret.name is required when audit.cloud.enabled is true" }}
{{- end }}
{{- end }}
{{- if and $policy.filterToolsList (not $policy.enabled) }}
{{- fail "policy.filterToolsList needs policy.enabled: the tools are filtered by the policy" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # Start a new pod before stopping an old one, so capacity never drops
  # during an upgrade (SPEC-0008-R03).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gateway.labels" . | nindent 8 }}
      {{- if .Values.metrics.scrapeAnnotations }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      serviceAccountName: {{ include "gateway.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ include "gateway.terminationGracePeriodSeconds" . }}
      # The Gateway watches MCPServer resources through the Kubernetes API.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --addr
            - {{ .Values.config.addr | quote }}
            {{- with .Values.config.stripRequestHeaders }}
            - --strip-request-headers
            - {{ join "," . | quote }}
            {{- end }}
            {{- with include "gateway.watchNamespaces" . }}
            - --watch-namespaces
            - {{ . | quote }}
            {{- end }}
            - --request-timeout
            - {{ .Values.config.requestTimeout | quote }}
            - --shutdown-delay
            - {{ .Values.config.shutdownDelay | default "5s" | quote }}
            - --shutdown-timeout
            - {{ .Values.config.shutdownTimeout | default "10s" | quote }}
            - --strict-protocol={{ ne (toString .Values.config.strictProtocol) "false" }}
            {{- with .Values.config.allowedOrigins }}
            - --allowed-origins
            - {{ join "," . | quote }}
            {{- end }}
            {{- if include "gateway.clientAuthEnabled" . }}
            - --auth
            - --auth-resource-url
            - {{ .Values.auth.resourceURL | trimSuffix "/" | quote }}
            - --auth-issuers
            - {{ toJson .Values.auth.issuers | quote }}
            {{- with .Values.auth.requiredScopes }}
            - --auth-required-scopes
            - {{ join "," . | quote }}
            {{- end }}
            {{- if (.Values.auth.gatewayAudience | default dict).enabled }}
            - --auth-gateway-audience-routes
            - {{ join "," .Values.auth.gatewayAudience.routes | quote }}
            {{- end }}
            {{- if $exchange }}
            - --token-exchange-secret-dir=/etc/kavrynt/token-exchange
            {{- end }}
            {{- end }}
            {{- if $credentials }}
            - --upstream-credentials-dir=/etc/kavrynt/upstream-credentials
            {{- end }}
            {{- if $policy.enabled }}
            - --policy-dir=/etc/kavrynt/policy
            {{- if $policy.filterToolsList }}
            - --policy-filter-tools-list
            {{- end }}
            {{- end }}
            {{- with .Values.audit }}
            {{- if .enabled }}
            - --audit
            - --audit-queue-size={{ .queueSize | default 10000 }}
            - --audit-on-overflow={{ .onOverflow | default "reject" }}
            {{- end }}
            {{- end }}
            {{- if $auditCloud.enabled }}
            - --audit-cloud-url={{ $auditCloud.url }}
            - --audit-cloud-token-file=/etc/kavrynt/audit-cloud/token
            - --audit-cloud-buffer-size={{ $auditCloud.bufferSize | default 100000 | int }}
            {{- end }}
            - {{ printf "--token-exchange-audiences=%s" ((.Values.global | default dict).tokenExchangeAudiences | default dict | toJson) | quote }}
            - --console={{ (.Values.console | default dict).enabled | default false }}
            {{- if include "gateway.consoleAuthEnabled" . }}
            - --console-auth=true
            - --console-auth-dir=/etc/kavrynt/console-auth
            - --console-session-ttl={{ .Values.console.auth.sessionTTL | default "12h" }}
            {{- with .Values.console.auth.trustedProxies }}
            - --console-trusted-proxies={{ join "," . }}
            {{- end }}
            {{- if include "gateway.consoleOIDCEnabled" . }}
            {{- $oidc := .Values.console.auth.oidc }}
            {{- /* Settings only; the client secret is a mounted file (SPEC-0032-R02). */}}
            - --console-oidc
            - {{ omit $oidc "enabled" "clientSecret" | toJson | quote }}
            - --console-oidc-secret-file=/etc/kavrynt/console-oidc/{{ $oidc.clientSecret.key | default "client-secret" }}
            {{- end }}
            {{- else }}
            - --console-auth=false
            {{- end }}
            - --alerts-config=/etc/kavrynt/alerts/config.json
            {{- $console := .Values.console | default dict }}
            - --history-max-tools={{ (($console.history | default dict).maxTools | default 500) | int }}
            {{- with $console.grafanaURL }}
            - --grafana-url={{ . }}
            {{- end }}
          env:
            # Names this replica in /v1/traffic (SPEC-0008-R06).
            - name: KAVRYNT_INSTANCE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # The kubelet mounts these Secrets and ConfigMaps; the Gateway's
          # service account has no RBAC on either.
          volumeMounts:
            - name: console-alerts
              mountPath: /etc/kavrynt/alerts
              readOnly: true
            {{- if include "gateway.consoleAuthEnabled" . }}
            - name: console-auth
              mountPath: /etc/kavrynt/console-auth
              readOnly: true
            {{- end }}
            {{- if include "gateway.consoleOIDCEnabled" . }}
            - name: console-oidc
              mountPath: /etc/kavrynt/console-oidc
              readOnly: true
            {{- end }}
            {{- if $credentials }}
            - name: upstream-credentials
              mountPath: /etc/kavrynt/upstream-credentials
              readOnly: true
            {{- end }}
            {{- if $policy.enabled }}
            - name: policy
              mountPath: /etc/kavrynt/policy
              readOnly: true
            {{- end }}
            {{- if $exchange }}
            - name: token-exchange
              mountPath: /etc/kavrynt/token-exchange
              readOnly: true
            {{- end }}
            {{- if $auditCloud.enabled }}
            - name: audit-cloud-token
              mountPath: /etc/kavrynt/audit-cloud
              readOnly: true
            {{- end }}
      volumes:
        # Console alert thresholds, which the umbrella chart writes from
        # metrics.prometheusRule (SPEC-0020-R03). Optional: without it the
        # Gateway uses the defaults.
        - name: console-alerts
          configMap:
            name: {{ .Release.Name }}-console-alerts
            optional: true
        {{- if include "gateway.consoleAuthEnabled" . }}
        - name: console-auth
          secret:
            secretName: {{ include "gateway.consoleAuthSecret" . }}
            defaultMode: 0444
        {{- end }}
        {{- if include "gateway.consoleOIDCEnabled" . }}
        - name: console-oidc
          secret:
            secretName: {{ .Values.console.auth.oidc.clientSecret.name | quote }}
            defaultMode: 0444
        {{- end }}
        {{- if $credentials }}
        # Upstream credentials of MCP servers that declare spec.credential
        # (SPEC-0011).
        - name: upstream-credentials
          secret:
            secretName: {{ $credentials | quote }}
            defaultMode: 0444
            # Pods start before the Secret exists; until then credentialed
            # servers answer 503 and their discovery reports the key missing.
            optional: true
        {{- end }}
        {{- if $policy.enabled }}
        # Tool authorization policy (SPEC-0012). Not optional: without it the
        # Gateway must not start.
        - name: policy
          configMap:
            name: {{ $policy.configMap | quote }}
        {{- end }}
        {{- if $exchange }}
        # The Gateway's client secrets for token exchange (SPEC-0015). Not
        # optional: the issuers that name a key need it.
        - name: token-exchange
          secret:
            secretName: {{ $exchange | quote }}
            defaultMode: 0444
        {{- end }}
        {{- if $auditCloud.enabled }}
        # The cluster token for audit delivery (SPEC-0017), as the file token.
        # Not optional: delivery needs it.
        - name: audit-cloud-token
          secret:
            secretName: {{ $auditCloud.tokenSecret.name | quote }}
            defaultMode: 0444
            items:
              - key: {{ $auditCloud.tokenSecret.key | default "token" | quote }}
                path: token
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else if include "gateway.multiReplica" . }}
      # Prefer different nodes and zones; never block scheduling (SPEC-0008-R04).
      topologySpreadConstraints:
        {{- range list "kubernetes.io/hostname" "topology.kubernetes.io/zone" }}
        - maxSkew: 1
          topologyKey: {{ . }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "gateway.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
