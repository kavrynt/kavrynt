{{- $credentials := (((.Values.global | default dict).upstreamCredentials | default dict).secretName) }}
{{- $policy := .Values.policy | default dict }}
{{- if and $policy.enabled (not $policy.configMap) }}
{{- fail "policy.configMap is required when policy.enabled is true: the ConfigMap with the .rego files" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # Start a new pod before stopping an old one, so capacity never drops
  # during an upgrade (SPEC-0008-R03).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gateway.labels" . | nindent 8 }}
      {{- if .Values.metrics.scrapeAnnotations }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      serviceAccountName: {{ include "gateway.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ include "gateway.terminationGracePeriodSeconds" . }}
      # The Gateway watches MCPServer resources through the Kubernetes API.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --addr
            - {{ .Values.config.addr | quote }}
            {{- with .Values.config.stripRequestHeaders }}
            - --strip-request-headers
            - {{ join "," . | quote }}
            {{- end }}
            {{- with include "gateway.watchNamespaces" . }}
            - --watch-namespaces
            - {{ . | quote }}
            {{- end }}
            - --request-timeout
            - {{ .Values.config.requestTimeout | quote }}
            - --shutdown-delay
            - {{ .Values.config.shutdownDelay | default "5s" | quote }}
            - --shutdown-timeout
            - {{ .Values.config.shutdownTimeout | default "10s" | quote }}
            {{- with .Values.config.allowedOrigins }}
            - --allowed-origins
            - {{ join "," . | quote }}
            {{- end }}
            {{- if include "gateway.clientAuthEnabled" . }}
            - --auth
            - --auth-resource-url
            - {{ .Values.auth.resourceURL | trimSuffix "/" | quote }}
            - --auth-issuers
            - {{ toJson .Values.auth.issuers | quote }}
            {{- with .Values.auth.requiredScopes }}
            - --auth-required-scopes
            - {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- if $credentials }}
            - --upstream-credentials-dir=/etc/kavrynt/upstream-credentials
            {{- end }}
            {{- if $policy.enabled }}
            - --policy-dir=/etc/kavrynt/policy
            {{- end }}
            - --console={{ (.Values.console | default dict).enabled | default false }}
            {{- if include "gateway.consoleAuthEnabled" . }}
            - --console-auth=true
            - --console-auth-dir=/etc/kavrynt/console-auth
            - --console-session-ttl={{ .Values.console.auth.sessionTTL | default "12h" }}
            {{- else }}
            - --console-auth=false
            {{- end }}
          env:
            # Names this replica in /v1/traffic (SPEC-0008-R06).
            - name: KAVRYNT_INSTANCE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or (include "gateway.consoleAuthEnabled" .) $credentials $policy.enabled }}
          # The kubelet mounts these Secrets; the Gateway's service account has
          # no RBAC on Secrets.
          volumeMounts:
            {{- if include "gateway.consoleAuthEnabled" . }}
            - name: console-auth
              mountPath: /etc/kavrynt/console-auth
              readOnly: true
            {{- end }}
            {{- if $credentials }}
            - name: upstream-credentials
              mountPath: /etc/kavrynt/upstream-credentials
              readOnly: true
            {{- end }}
            {{- if $policy.enabled }}
            - name: policy
              mountPath: /etc/kavrynt/policy
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or (include "gateway.consoleAuthEnabled" .) $credentials $policy.enabled }}
      volumes:
        {{- if include "gateway.consoleAuthEnabled" . }}
        - name: console-auth
          secret:
            secretName: {{ include "gateway.consoleAuthSecret" . }}
            defaultMode: 0444
        {{- end }}
        {{- if $credentials }}
        # Upstream credentials of MCP servers that declare spec.credential
        # (SPEC-0011).
        - name: upstream-credentials
          secret:
            secretName: {{ $credentials | quote }}
            defaultMode: 0444
            # Pods start before the Secret exists; until then credentialed
            # servers answer 503 and their discovery reports the key missing.
            optional: true
        {{- end }}
        {{- if $policy.enabled }}
        # Tool authorization policy (SPEC-0012). Not optional: without it the
        # Gateway must not start.
        - name: policy
          configMap:
            name: {{ $policy.configMap | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else if include "gateway.multiReplica" . }}
      # Prefer different nodes and zones; never block scheduling (SPEC-0008-R04).
      topologySpreadConstraints:
        {{- range list "kubernetes.io/hostname" "topology.kubernetes.io/zone" }}
        - maxSkew: 1
          topologyKey: {{ . }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "gateway.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
