{{- /*
Console admin password and session signing key (SPEC-0005), generated once
like Argo CD's initial admin secret. Upgrades reuse the stored values; the
Secret survives uninstall so a reinstall keeps the same password. Renders
without cluster access (helm template) cannot look it up and generate new
values: use console.auth.existingSecret there.
*/ -}}
{{- $auth := (.Values.console | default dict).auth | default dict -}}
{{- if and (include "gateway.consoleAuthEnabled" .) (not $auth.existingSecret) -}}
{{- $name := include "gateway.consoleAuthSecret" . -}}
{{- $password := randAlphaNum 32 | b64enc -}}
{{- $sessionKey := randAlphaNum 64 | b64enc -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing $existing.data -}}
{{- $password = index $existing.data "password" | default $password -}}
{{- $sessionKey = index $existing.data "sessionKey" | default $sessionKey -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password }}
  sessionKey: {{ $sessionKey }}
{{- end }}
