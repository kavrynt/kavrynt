{{- /*
The key that binds MCP session IDs to their caller (SPEC-0042-R06): 64 random
characters, generated once like the console admin Secret. Upgrades reuse the
stored value and the Secret survives uninstall; every replica mounts the same
one, so a session works through any of them, and a rolling restart keeps
sessions. Renders without cluster access (helm template, GitOps) cannot look
it up and would generate a new key each time, ending every session: set
auth.sessionKeySecret there.
*/ -}}
{{- if and (include "gateway.clientAuthEnabled" .) (not .Values.auth.sessionKeySecret) -}}
{{- $name := include "gateway.sessionKeySecret" . -}}
{{- $key := randAlphaNum 64 | b64enc -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing $existing.data -}}
{{- $key = index $existing.data "sessionKey" | default $key -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  sessionKey: {{ $key }}
{{- end }}
