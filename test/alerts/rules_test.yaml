# promtool unit tests for the chart's alert rules. scripts/test-alerts.sh
# renders the rules (every alert on, runbooks at https://runbooks.test) into
# rules.yaml next to this file and runs `promtool test rules`.
# Verifies SPEC-0010-R03, SPEC-0010-R04, SPEC-0010-R06, and SPEC-0010-R08: every
# alert fires and stays quiet as specified, with only bounded labels.
# Verifies SPEC-0010-R07: the same run fails when an alert and a runbook in
# docs/runbooks do not match one to one, or a runbook lacks a section.
rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  - name: KavryntGatewayDown fires when no Gateway target is up
    interval: 1m
    input_series:
      - series: 'up{job="kavrynt-gateway", instance="10.0.0.1:8080"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: KavryntGatewayDown
        exp_alerts:
          - exp_labels: {severity: critical, component: gateway}
            exp_annotations:
              summary: No Kavrynt Gateway replica is up.
              description: Prometheus has scraped no healthy target of job kavrynt-gateway for 5 minutes. MCP clients cannot reach any routed server.
              runbook_url: https://runbooks.test/KavryntGatewayDown.md

  - name: KavryntGatewayDown stays quiet while a Gateway is up
    interval: 1m
    input_series:
      - series: 'up{job="kavrynt-gateway", instance="10.0.0.1:8080"}'
        values: '0x5 1x10'
      - series: 'up{job="kavrynt-gateway", instance="10.0.0.2:8080"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: KavryntGatewayDown
        exp_alerts: []

  - name: KavryntGatewayRouteSyncFailing fires on failures without a success
    interval: 1m
    input_series:
      - series: 'kavrynt_gateway_route_sync_failure_total{job="kavrynt-gateway", instance="10.0.0.1:8080"}'
        values: '0+1x30'
      - series: 'kavrynt_gateway_route_sync_success_total{job="kavrynt-gateway", instance="10.0.0.1:8080"}'
        values: '3x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KavryntGatewayRouteSyncFailing
        exp_alerts:
          - exp_labels: {severity: critical, component: gateway, instance: "10.0.0.1:8080"}
            exp_annotations:
              summary: Gateway 10.0.0.1:8080 cannot sync its routes.
              description: Route syncs from the Kubernetes API failed for 10 minutes without one success. The replica keeps its last routes, but new, changed, and deleted MCPServers are not applied.
              runbook_url: https://runbooks.test/KavryntGatewayRouteSyncFailing.md

  - name: KavryntGatewayRouteSyncFailing stays quiet when syncs also succeed
    interval: 1m
    input_series:
      - series: 'kavrynt_gateway_route_sync_failure_total{job="kavrynt-gateway", instance="10.0.0.1:8080"}'
        values: '0+1x30'
      - series: 'kavrynt_gateway_route_sync_success_total{job="kavrynt-gateway", instance="10.0.0.1:8080"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KavryntGatewayRouteSyncFailing
        exp_alerts: []

  - name: KavryntMCPUpstreamErrorsHigh fires at 20% upstream failures
    interval: 1m
    input_series:
      - series: 'kavrynt_gateway_mcp_requests_total{job="kavrynt-gateway", instance="10.0.0.1:8080", route="team-a.search", method="tools/call", tool="search", outcome="ok"}'
        values: '0+48x30'
      - series: 'kavrynt_gateway_mcp_requests_total{job="kavrynt-gateway", instance="10.0.0.1:8080", route="team-a.search", method="tools/call", tool="search", outcome="upstream_unreachable"}'
        values: '0+12x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KavryntMCPUpstreamErrorsHigh
        exp_alerts:
          - exp_labels: {severity: warning, component: mcp-server, route: team-a.search}
            exp_annotations:
              summary: MCP route team-a.search fails upstream.
              description: 20% of calls to team-a.search ended in upstream_error, upstream_unreachable, or timeout over 10 minutes.
              runbook_url: https://runbooks.test/KavryntMCPUpstreamErrorsHigh.md

  - name: KavryntMCPUpstreamErrorsHigh stays quiet at 1%, and for idle routes
    interval: 1m
    input_series:
      - series: 'kavrynt_gateway_mcp_requests_total{job="kavrynt-gateway", route="team-a.search", outcome="ok"}'
        values: '0+99x30'
      - series: 'kavrynt_gateway_mcp_requests_total{job="kavrynt-gateway", route="team-a.search", outcome="timeout"}'
        values: '0+1x30'
      # One failed call every ten minutes: 100% errors, but below the rate floor.
      - series: 'kavrynt_gateway_mcp_requests_total{job="kavrynt-gateway", route="team-b.rare", outcome="upstream_error"}'
        values: '0+0.1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KavryntMCPUpstreamErrorsHigh
        exp_alerts: []

  - name: KavryntMCPLatencyHigh fires when p95 exceeds 5 seconds
    interval: 1m
    input_series:
      - series: 'kavrynt_gateway_mcp_request_duration_seconds_bucket{job="kavrynt-gateway", route="team-a.search", le="1"}'
        values: '0x40'
      - series: 'kavrynt_gateway_mcp_request_duration_seconds_bucket{job="kavrynt-gateway", route="team-a.search", le="5"}'
        values: '0x40'
      - series: 'kavrynt_gateway_mcp_request_duration_seconds_bucket{job="kavrynt-gateway", route="team-a.search", le="10"}'
        values: '0+60x40'
      - series: 'kavrynt_gateway_mcp_request_duration_seconds_bucket{job="kavrynt-gateway", route="team-a.search", le="+Inf"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: KavryntMCPLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning, component: mcp-server, route: team-a.search}
            exp_annotations:
              summary: MCP route team-a.search is slow.
              description: The p95 latency of calls to team-a.search has been 9.75s for 15 minutes.
              runbook_url: https://runbooks.test/KavryntMCPLatencyHigh.md

  - name: KavryntMCPLatencyHigh stays quiet for fast routes
    interval: 1m
    input_series:
      - series: 'kavrynt_gateway_mcp_request_duration_seconds_bucket{job="kavrynt-gateway", route="team-a.search", le="1"}'
        values: '0+60x40'
      - series: 'kavrynt_gateway_mcp_request_duration_seconds_bucket{job="kavrynt-gateway", route="team-a.search", le="+Inf"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: KavryntMCPLatencyHigh
        exp_alerts: []

  - name: KavryntOperatorDown fires when no Operator target is up
    interval: 1m
    input_series:
      - series: 'up{job="kavrynt-operator-metrics", instance="10.0.0.3:8080"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: KavryntOperatorDown
        exp_alerts:
          - exp_labels: {severity: critical, component: operator}
            exp_annotations:
              summary: No Kavrynt Operator replica is up.
              description: Prometheus has scraped no healthy target of job kavrynt-operator-metrics for 5 minutes. New and changed MCPServers are not validated, so the Gateway does not route them.
              runbook_url: https://runbooks.test/KavryntOperatorDown.md

  - name: KavryntOperatorDown stays quiet while one replica is up
    interval: 1m
    input_series:
      - series: 'up{job="kavrynt-operator-metrics", instance="10.0.0.3:8080"}'
        values: '1x15'
      - series: 'up{job="kavrynt-operator-metrics", instance="10.0.0.4:8080"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: KavryntOperatorDown
        exp_alerts: []

  - name: KavryntMCPServerNotReady names the server that is not Ready
    interval: 1m
    input_series:
      - series: 'kavrynt_operator_mcpserver_ready{job="kavrynt-operator-metrics", instance="10.0.0.3:8080", namespace="team-a", name="search"}'
        values: '0x20'
      - series: 'kavrynt_operator_mcpserver_ready{job="kavrynt-operator-metrics", instance="10.0.0.3:8080", namespace="team-a", name="billing"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: KavryntMCPServerNotReady
        exp_alerts:
          - exp_labels: {severity: warning, component: mcp-server, namespace: team-a, name: search}
            exp_annotations:
              summary: MCPServer team-a/search is not Ready.
              description: The Operator has reported team-a/search as not Ready for 10m; the Gateway does not route it.
              runbook_url: https://runbooks.test/KavryntMCPServerNotReady.md

  - name: KavryntMCPServerNotReady waits for the configured time
    interval: 1m
    input_series:
      - series: 'kavrynt_operator_mcpserver_ready{job="kavrynt-operator-metrics", namespace="team-a", name="search"}'
        values: '1x5 0x5'
    alert_rule_test:
      - eval_time: 10m
        alertname: KavryntMCPServerNotReady
        exp_alerts: []

  - name: KavryntCloudSyncStale fires when Cloud has accepted nothing for 10 minutes
    interval: 1m
    input_series:
      - series: 'kavrynt_operator_cloud_sync_last_success_timestamp_seconds{job="kavrynt-operator-metrics", instance="10.0.0.3:8080"}'
        values: '60x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KavryntCloudSyncStale
        exp_alerts:
          - exp_labels: {severity: warning, component: operator}
            exp_annotations:
              summary: The Operator has not synced to Kavrynt Cloud.
              description: Kavrynt Cloud last accepted an inventory snapshot 19m 0s ago.
              runbook_url: https://runbooks.test/KavryntCloudSyncStale.md

  - name: KavryntCloudSyncStale stays quiet while syncs succeed
    interval: 1m
    input_series:
      - series: 'kavrynt_operator_cloud_sync_last_success_timestamp_seconds{job="kavrynt-operator-metrics", instance="10.0.0.3:8080"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KavryntCloudSyncStale
        exp_alerts: []
