apiVersion: v1
kind: Namespace
metadata:
  name: kavrynt-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-mcp-server
  namespace: kavrynt-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-mcp-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          image: __SAMPLE_IMAGE__
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: example-mcp-server
  namespace: kavrynt-e2e
spec:
  selector:
    app.kubernetes.io/name: example-mcp-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: kavrynt.io/v1alpha1
kind: MCPServer
metadata:
  name: example-mcp-server
  namespace: kavrynt-e2e
spec:
  version: 0.0.1-beta.1
  transport: http
  endpoint: http://example-mcp-server.kavrynt-e2e.svc.cluster.local:8080
