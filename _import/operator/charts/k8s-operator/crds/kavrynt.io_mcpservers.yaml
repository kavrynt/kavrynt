apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpservers.kavrynt.io
spec:
  group: kavrynt.io
  scope: Namespaced
  names:
    plural: mcpservers
    singular: mcpserver
    kind: MCPServer
    shortNames:
      - mcps
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - version
                - transport
              x-kubernetes-validations:
                - rule: "self.transport != 'http' || has(self.endpoint)"
                  message: "spec.endpoint is required when spec.transport is http"
                - rule: "self.transport != 'stdio' || has(self.command)"
                  message: "spec.command is required when spec.transport is stdio"
              properties:
                version:
                  type: string
                  minLength: 1
                transport:
                  type: string
                  enum:
                    - http
                    - stdio
                command:
                  type: string
                args:
                  type: array
                  items:
                    type: string
                endpoint:
                  type: string
                environment:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                registrySyncedAt:
                  type: string
                  format: date-time
                registryError:
                  type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Transport
          type: string
          jsonPath: .spec.transport
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Registered
          type: string
          jsonPath: .status.conditions[?(@.type=="Registered")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
