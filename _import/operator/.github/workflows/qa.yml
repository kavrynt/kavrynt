name: Secure QA

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STATICCHECK_VERSION: v0.8.0
  GOSEC_VERSION: v2.28.0
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  go:
    name: Go QA and SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Unit tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...

      - name: Gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION} -exclude-dir=.cache ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

      - name: Build binary
        run: |
          go build \
            -trimpath \
            -ldflags="-X github.com/kavrynt/k8s-operator/internal/build.Version=0.0.1-beta-ci -X github.com/kavrynt/k8s-operator/internal/build.Commit=${GITHUB_SHA} -X github.com/kavrynt/k8s-operator/internal/build.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/manager .

      - name: Binary smoke test
        run: ./bin/manager --help

  source-scan:
    name: Trivy Source Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan source and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1

  helm:
    name: Helm and Manifest QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint chart
        run: helm lint charts/k8s-operator

      - name: Render chart
        run: helm template k8s-operator charts/k8s-operator

      - name: Render raw manifests
        run: kubectl kustomize config

  image:
    name: Multi-architecture Image and Trivy
    runs-on: ubuntu-latest
    needs: [go, source-scan, helm]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build OCI image archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          build-args: |
            VERSION=0.0.1-beta-ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
          tags: kavrynt/operator:ci
          provenance: false
          sbom: false

      - name: Extract OCI layout
        run: |
          mkdir -p "${{ runner.temp }}/image"
          tar -xf "${{ runner.temp }}/image.tar" -C "${{ runner.temp }}/image"

      - name: Scan AMD64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          input: ${{ runner.temp }}/image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1

      - name: Scan ARM64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: image
          input: ${{ runner.temp }}/image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
